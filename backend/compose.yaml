services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurex
      POSTGRES_USER: procurex
      POSTGRES_PASSWORD: procurex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurex -d procurex"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - procurex_postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: procurex
      RABBITMQ_DEFAULT_PASS: procurex
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  procurex_postgres:

