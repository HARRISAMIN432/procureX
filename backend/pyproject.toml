[project]
name = "procurex-backend"
version = "0.1.0"
description = "ProcureX API and worker foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery>=5.6,<6",
  "cloudinary>=1.41,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "langchain>=1,<2",
  "langchain-google-genai>=4,<5",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "openpyxl>=3.1,<4",
  "ortools>=9.14,<10",
  "pillow>=12,<13",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6,<7",
  "pyseccomp>=0.1.2,<1",
  "python-docx>=1.2,<2",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
