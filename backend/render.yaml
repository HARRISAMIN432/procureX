# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: procurex-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: /bin/sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: PROCUREX_ENVIRONMENT
        value: production
      - key: PROCUREX_DEBUG
        value: "false"
      - key: PROCUREX_AUTH_MODE
        value: oidc
      - key: PROCUREX_ALLOW_SELF_SERVICE_ORGANIZATION_SIGNUP
        value: "true"
      - key: PROCUREX_ALLOWED_HOSTS
        value: '[]'
      - key: PROCUREX_CORS_ALLOWED_ORIGINS
        value: '[]'
      - key: PROCUREX_RENDER_EXTERNAL_HOSTNAME
        fromService:
          name: procurex-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PROCUREX_RENDER_EXTERNAL_URL
        fromService:
          name: procurex-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROCUREX_RENDER_FRONTEND_URL
        fromService:
          name: procurex-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROCUREX_DATABASE_URL
        fromDatabase:
          name: procurex-db
          property: connectionString
      - key: PROCUREX_DATABASE_POOL_SIZE
        value: "5"
      - key: PROCUREX_DATABASE_MAX_OVERFLOW
        value: "5"
      - key: PROCUREX_TASK_EXECUTION_MODE
        value: eager
      - key: PROCUREX_RABBITMQ_URL
        value: memory://
      - key: PROCUREX_REDIS_URL
        value: cache+memory://
      - key: PROCUREX_CLOUDINARY_FOLDER_PREFIX
        value: procurex/production
      - key: PROCUREX_DOCUMENT_MAX_UPLOAD_BYTES
        value: "10000000"
      - key: PROCUREX_DOCUMENT_PARSER_MEMORY_BYTES
        value: "268435456"
      - key: PROCUREX_OIDC_ISSUER
        sync: false
      - key: PROCUREX_OIDC_AUDIENCE
        sync: false
      - key: PROCUREX_OIDC_JWKS_URL
        sync: false
      - key: PROCUREX_OIDC_AUTHORIZATION_URL
        sync: false
      - key: PROCUREX_OIDC_TOKEN_URL
        sync: false
      - key: PROCUREX_OIDC_CLIENT_SECRET
        sync: false
      - key: PROCUREX_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: PROCUREX_CLOUDINARY_API_KEY
        sync: false
      - key: PROCUREX_CLOUDINARY_API_SECRET
        sync: false
      - key: PROCUREX_GEMINI_API_KEY
        sync: false
      - key: PROCUREX_LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: PROCUREX_EMAIL_PROVIDER
        value: resend
      - key: PROCUREX_RESEND_API_KEY
        sync: false
      - key: PROCUREX_EMAIL_FROM
        sync: false
      - key: PROCUREX_WEB_APP_URL
        fromService:
          name: procurex-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: procurex-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: procurex
    user: procurex
    ipAllowList: []
